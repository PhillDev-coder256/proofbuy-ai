services:
  - type: web
    name: proofbuy-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # set in Render dashboard — use PostgreSQL add-on URL
      - key: CHANNEL3_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: AI_PROVIDER_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a secure random value
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # set after knowing frontend URL
